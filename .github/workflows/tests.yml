name: Tests

on: [push]

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: start test environment
        run: docker compose up testphp -d

      - name: run oxfmt
        run: docker compose exec -T testphp sh -c "npm run fmt:check"

      - name: run phpstan
        run: docker compose exec -T testphp sh -c "composer run analyse"

      - name: run pint
        run: docker compose exec -T testphp sh -c "composer run pint"
