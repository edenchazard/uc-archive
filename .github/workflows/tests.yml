name: Tests

on: [push]

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build testapp image
        run: docker compose up -d testapp

      - name: Run prettier
        run: docker compose exec -T testapp sh -c "npm run fmt:check"

      - name: Run phpstan
        run: docker compose exec -T testapp sh -c "composer run analyse"

      - name: Run pint
        run: docker compose exec -T testapp sh -c "composer run pint"
