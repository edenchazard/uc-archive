services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 5173:5173
    networks:
      - internal
    volumes:
      - ./app:/var/www/app
      - ./bootstrap/app.php:/var/www/bootstrap/app.php
      - ./config:/var/www/config
      - ./routes:/var/www/routes
      - ./settings:/var/www/settings
      - ./database:/var/www/database
      - ./public:/var/www/public
      - ./storage:/var/www/storage
      - ./lang:/var/www/lang
      - ./resources:/var/www/resources
      - ./composer.json:/var/www/composer.json
      - ./composer.lock:/var/www/composer.lock
      - ./package.json:/var/www/package.json
      - ./package-lock.json:/var/www/package-lock.json
      - ./vite.config.js:/var/www/vite.config.js
      - ./.env:/var/www/.env
      - .docker-contents/php.ini:/etc/php/8.5/fpm/php.ini
      - appdata:/var/www/storage
      - web_content:/var/www

  testphp:
    build:
      context: .
      dockerfile: Dockerfile.dev
    networks:
      - internal
    volumes:
      - ./app:/var/www/app
      - ./bootstrap/app.php:/var/www/bootstrap/app.php
      - ./config:/var/www/config
      - ./routes:/var/www/routes
      - ./settings:/var/www/settings
      - ./database:/var/www/database
      - ./public/images:/var/www/public/images
      - ./storage:/var/www/storage
      - ./lang:/var/www/lang
      - ./resources:/var/www/resources
      - ./composer.json:/var/www/composer.json
      - ./composer.lock:/var/www/composer.lock
      - ./package.json:/var/www/package.json
      - ./package-lock.json:/var/www/package-lock.json
      - ./vite.config.js:/var/www/vite.config.js
      - ./.env:/var/www/.env
      - ./tests:/var/www/tests
      - ./phpstan.neon:/var/www/phpstan.neon
      - ./.prettierignore:/var/www/.prettierignore
      - ./.prettierrc:/var/www/.prettierrc

  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine-slim
    ports:
      - 80:8080
    depends_on:
      - php
    networks:
      - internal
    volumes:
      - .docker-contents/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./public/images:/var/www/public/images
      - ./resources:/var/www/resources
      - web_content:/var/www

networks:
  internal:

volumes:
  web_content:
  appdata:
